[project]
name = "deepchembenchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chembl-webresource-client>=0.10.9",
    "deepchem>=2.8.0",
    "ipykernel>=7.3.0",
    "json2vec @ git+https://github.com/json2vec/json2vec.git@dev/global-entity",
    "pdbfixer>=1.12.0",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "rdkit>=2026.3.4",
    "requests>=2.34.2",
    "torch>=2.13.0",
]

[project.scripts]
deepchembenchmark = "deepchembenchmark:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
